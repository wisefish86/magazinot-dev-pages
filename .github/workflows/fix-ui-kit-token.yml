name: One-time fix UI kit token

on:
  push:
    paths:
      - '.github/workflows/fix-ui-kit-token.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add missing UI kit gap token
        shell: bash
        run: |
          if ! grep -q -- '--ui-gap:' magazinot_gen.css; then
            sed -i '/--c-danger:#a84f4f;/a\  --ui-gap:16px;' magazinot_gen.css
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add magazinot_gen.css
            git commit -m "Fix UI kit gap token"
            git push
          fi
