name: Validate UI Kit refactor

on:
  push:
    branches:
      - 'refactor/ui-kit-canonical-*'
      - 'feature/ui-kit-marker-tabs-*'
      - 'fix/ui-kit-marker-matrix-*'
      - 'fix/ui-kit-polish-*'
      - 'refactor/central-icons-palette-*'
      - 'fix/ui-kit-ux-audit-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical marking palette
        run: |
          node scripts/sync-medium-colors.mjs
          node scripts/sync-medium-colors.mjs --check
      - name: Generate normative navigation
        run: node scripts/generate-markirovka-normdocs.mjs
      - name: Inject shared UI
        run: node scripts/inject-magazinot-ui.mjs
      - name: Validate component coverage and JS
        run: node scripts/validate-magazinot-ui.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check all pages at desktop and mobile sizes
        run: node scripts/visual-regression-check.mjs
      - name: Verify three-tab marker demo interactions
        run: node scripts/test-marker-demo.mjs
      - name: Upload refactor screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-kit-refactor-screenshots
          path: visual-snapshots/ui-kit-refactor/
          if-no-files-found: ignore
      - name: Check CSS braces and legacy selectors
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const css = fs.readFileSync('magazinot_gen.css','utf8');
          let depth = 0;
          for (const c of css.replace(/\/\*[\s\S]*?\*\//g,'')) {
            if (c === '{') depth++;
            if (c === '}') depth--;
            if (depth < 0) throw Error('Unexpected closing brace');
          }
          if (depth) throw Error('Unclosed CSS block');
          if (/\.docpage__toc(?:\b|[-_])/.test(css)) throw Error('Legacy TOC selector');
          NODE
