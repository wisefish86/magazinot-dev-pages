name: Validate UI Kit refactor

on:
  push:
    branches:
      - 'refactor/ui-kit-canonical-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate normative navigation
        run: node scripts/generate-markirovka-normdocs.mjs
      - name: Inject shared UI
        run: node scripts/inject-magazinot-ui.mjs
      - name: Validate component coverage and JS
        run: node scripts/validate-magazinot-ui.mjs
      - name: Check CSS braces and legacy selectors
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const css = fs.readFileSync('magazinot_gen.css','utf8');
          let depth = 0;
          for (const c of css.replace(/\/\*[\s\S]*?\*\//g,'')) {
            if (c === '{') depth++;
            if (c === '}') depth--;
            if (depth < 0) throw Error('Unexpected closing brace');
          }
          if (depth) throw Error('Unclosed CSS block');
          if (/\.docpage__toc(?:\b|[-_])/.test(css)) throw Error('Legacy TOC selector');
          NODE
