name: Cleanup temporary UI kit workflows

on:
  push:
    paths:
      - '.github/workflows/cleanup-ui-kit-temp.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary workflow files
        shell: bash
        run: |
          rm -f .github/workflows/fix-ui-kit-token.yml
          rm -f .github/workflows/cleanup-ui-kit-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary UI kit workflows"
          git push
