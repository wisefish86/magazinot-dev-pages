name: UI Kit visual QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'pages/**'
      - 'site-assets/**'
      - 'magazinot_gen.css'
      - 'magazinot_gen.js'
      - 'scripts/**'
      - '.github/workflows/visual-qa.yml'
  push:
    branches: [main, 'feature/automated-visual-qa-*', 'fix/faq-actual-first-row-spacing-*', 'fix/visual-qa-lazy-images-*']
    paths:
      - 'pages/**'
      - 'site-assets/**'
      - 'magazinot_gen.css'
      - 'magazinot_gen.js'
      - 'scripts/**'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare generated UI
        run: |
          node scripts/sync-medium-colors.mjs
          node scripts/generate-markirovka-normdocs.mjs
          node scripts/inject-magazinot-ui.mjs
          node scripts/validate-magazinot-ui.mjs
      - name: Checkout original hazard pictograms
        uses: actions/checkout@v4
        with:
          repository: wisefish86/andrey-local
          ref: 745b8082a5e33b233e2e954da4a93e4aa6cea288
          path: source-reference
          sparse-checkout: |
            reference/magazinot/pipemarkers/hazards
          persist-credentials: false
      - name: Stage original hazard pictograms for local browser QA
        run: |
          mkdir -p site-assets/img/pipemarkers/hazards
          cp source-reference/reference/magazinot/pipemarkers/hazards/w??-32x30.png site-assets/img/pipemarkers/hazards/
          test "$(find site-assets/img/pipemarkers/hazards -maxdepth 1 -name 'w??-32x30.png' | wc -l)" -eq 8
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Audit component CSS inventory
        run: node scripts/audit-magazinot-css.mjs --check
      - name: Capture desktop and mobile screenshots
        run: node scripts/visual-qa.mjs
      - name: Verify interactive UI
        run: node scripts/test-marker-demo.mjs
      - name: Publish screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-page-desktop-mobile-qa
          path: visual-snapshots/review/
          if-no-files-found: warn
          retention-days: 30
      - name: Summarize visual review links
        if: always()
        run: |
          echo '### UI Kit visual QA' >> "$GITHUB_STEP_SUMMARY"
          echo 'Desktop: 1440px; Mobile: 390px. Full-page PNG for each mk-ui page.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Open artifact **full-page-desktop-mobile-qa** to inspect screenshots and report.json.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Automated checks catch overflow and JS errors; aesthetics require image review.' >> "$GITHUB_STEP_SUMMARY"
