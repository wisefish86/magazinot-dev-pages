name: Deploy MagazinOT dev pages

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - 'scripts/**'
      - 'site-assets/**'
      - 'magazinot_gen.css'
      - 'magazinot_gen.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-magazinot-dev-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: magazinot.ru
      FTP_USERNAME: dev_pages
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      ASSETS_FTP_SERVER: magazinot.ru
      ASSETS_FTP_USERNAME: assets
      ASSETS_FTP_PASSWORD: ${{ secrets.ASSETS_FTP_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate pipeline marking normative navigation
        run: node scripts/generate-markirovka-normdocs.mjs

      - name: Inject shared UI
        run: node scripts/inject-magazinot-ui.mjs

      - name: Validate shared UI
        run: node scripts/validate-magazinot-ui.mjs

      - name: Generate DEV catalog
        run: node scripts/generate-dev-index.mjs

      - name: Deploy pages
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          local-dir: ./pages/
          server-dir: /pages/
          dangerous-clean-slate: false

      - name: Prepare shared frontend assets
        run: |
          mkdir -p deploy-assets
          cp magazinot_gen.css deploy-assets/magazinot_gen.css
          cp magazinot_gen.js deploy-assets/magazinot_gen.js

      - name: Deploy shared frontend assets
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          local-dir: ./deploy-assets/
          server-dir: /
          dangerous-clean-slate: false

      - name: Checkout source reference assets
        uses: actions/checkout@v4
        with:
          repository: wisefish86/andrey-local
          ref: 745b8082a5e33b233e2e954da4a93e4aa6cea288
          path: source-reference
          sparse-checkout: |
            reference/magazinot/pipemarkers/hazards
          persist-credentials: false

      - name: Stage original hazard pictograms
        run: |
          set -euo pipefail
          source_dir="source-reference/reference/magazinot/pipemarkers/hazards"
          destination="site-assets/img/pipemarkers/hazards"
          test "$(find "$source_dir" -maxdepth 1 -type f -name 'w??-32x30.png' | wc -l)" -eq 8
          mkdir -p "$destination"
          cp "$source_dir"/w??-32x30.png "$destination"/
          test "$(find "$destination" -maxdepth 1 -type f -name 'w??-32x30.png' | wc -l)" -eq 8

      - name: Deploy page-specific runtime assets
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.ASSETS_FTP_SERVER }}
          username: ${{ env.ASSETS_FTP_USERNAME }}
          password: ${{ env.ASSETS_FTP_PASSWORD }}
          local-dir: ./site-assets/
          server-dir: /
          dangerous-clean-slate: false
