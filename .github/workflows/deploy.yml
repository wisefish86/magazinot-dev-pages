name: Deploy MagazinOT dev pages

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - 'scripts/**'
      - 'magazinot_gen.css'
      - 'magazinot_gen.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-magazinot-dev-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: magazinot.ru
      FTP_USERNAME: dev_pages
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate DEV catalog
        run: node scripts/generate-dev-index.mjs

      - name: Deploy pages
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          local-dir: ./pages/
          server-dir: /pages/
          dangerous-clean-slate: false

      - name: Prepare shared frontend assets
        run: |
          mkdir -p deploy-assets
          cp magazinot_gen.css deploy-assets/magazinot_gen.css
          cp magazinot_gen.js deploy-assets/magazinot_gen.js

      - name: Deploy shared frontend assets
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          local-dir: ./deploy-assets/
          server-dir: /
          dangerous-clean-slate: false


      - name: Capture visual snapshots
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          mkdir -p visual-snapshots
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const url = 'https://magazinot.ru/dev-preview--uid-0002286147/?page=markirovka-truboprovodov';
            const browser = await chromium.launch({ headless: true });

            for (const shot of [
              { name: 'desktop', viewport: { width: 1440, height: 1000 } },
              { name: 'mobile', viewport: { width: 390, height: 844 } },
            ]) {
              const context = await browser.newContext({ viewport: shot.viewport, deviceScaleFactor: 1 });
              const page = await context.newPage();
              await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
              await page.evaluate(async () => { if (document.fonts?.ready) await document.fonts.ready; });
              await page.waitForTimeout(1000);
              await page.screenshot({
                path: `visual-snapshots/markirovka-truboprovodov-${shot.name}.jpg`,
                type: 'jpeg',
                quality: 72,
                fullPage: true,
              });
              await context.close();
            }

            await browser.close();
          })();
          NODE

      - name: Commit visual snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-snapshots/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update visual snapshots [skip ci]"
            git push
          fi
