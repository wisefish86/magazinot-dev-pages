name: Deploy MagazinOT dev pages

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - 'scripts/**'
      - 'magazinot_gen.css'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-magazinot-dev-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: magazinot.ru
      FTP_USERNAME: dev_pages
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate DEV catalog
        run: node scripts/generate-dev-index.mjs

      - name: Deploy pages
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          local-dir: ./pages/
          server-dir: /pages/
          dangerous-clean-slate: false

      - name: Prepare stylesheet
        run: |
          mkdir -p deploy-css
          cp magazinot_gen.css deploy-css/magazinot_gen.css

      - name: Deploy stylesheet
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          local-dir: ./deploy-css/
          server-dir: /
          dangerous-clean-slate: false
